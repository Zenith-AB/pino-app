# Parámetros del pipeline de entrenamiento (params:<nombre> en los nodos).

firebase_project_id: pino-app

modelo_adaptativo:
  # Mínimos para entrenar; con menos datos no se registra ningún modelo.
  min_filas: 200
  min_perfiles: 5
  # Fracción de perfiles que se reserva para medir el modelo.
  test_size: 0.2
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
