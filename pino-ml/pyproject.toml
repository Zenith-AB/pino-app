[project]
name = "pino-ml"
version = "0.1.0"
description = "Backend ML para Pino — Plataforma de alfabetización en español"
requires-python = ">=3.10"
dependencies = [
    # ── Framework de pipelines ──
    "kedro>=0.19.0",
    "kedro-datasets>=2.0.0",

    # ── ML / Deep Learning ──
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",

    # ── Procesamiento de audio/voz ──
    "openai-whisper>=20231117",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "jiwer>=3.0.0",          # Word Error Rate para evaluación STT

    # ── NLP en español ──
    "spacy>=3.7.0",
    "textstat>=0.7.3",       # Legibilidad de textos

    # ── API de serving ──
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",

    # ── MLOps ──
    "mlflow>=2.9.0",
    "databricks-sdk>=0.14.0",

    # ── Firebase / datos ──
    "firebase-admin>=6.3.0",
    "google-cloud-firestore>=2.14.0",
    "google-cloud-storage>=2.14.0",

    # ── Utilidades ──
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

airflow = [
    "apache-airflow>=2.8.0",
    "apache-airflow-providers-databricks>=6.0.0",
]
