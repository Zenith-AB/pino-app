[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pino-ml"
version = "0.1.0"
description = "Backend ML para Pino — Plataforma de alfabetización en español"
requires-python = ">=3.10"
# Núcleo compartido por la API y el entrenamiento.
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
# Servir la API: pip install -e ".[api]"
# El modelo de spaCy se instala aparte: python -m spacy download es_core_news_md
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",    # uvicorn --env-file .env
    "openai-whisper>=20231117",
    "torch>=2.1.0",
    "jiwer>=3.0.0",            # Word Error Rate para evaluación STT
    "spacy>=3.7.0",
]

# Pipeline de entrenamiento: pip install -e ".[training]"
training = [
    "kedro>=1.0,<2",
    "mlflow>=2.9.0",
    "firebase-admin>=6.3.0",
]

# Orquestación (VM de Airflow): pip install -e ".[training,airflow]"
airflow = [
    "apache-airflow>=2.8.0,<3",
    "apache-airflow-providers-databricks>=6.0.0",
]

# Modelo de edad de adquisición (/predict/aoa-palabra). Mismas versiones que
# eft-machine-learning/requirements.txt; requiere Python 3.12 o superior.
aoa = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "openpyxl==3.1.5",
    "joblib==1.6.0",
]

dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",           # TestClient de FastAPI
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "pino_ml"
project_name = "pino-ml"
kedro_init_version = "1.0.0"
source_dir = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
