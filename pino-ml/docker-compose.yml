version: '3.8'

services:
  pino-ml-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pino-ml-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - WHISPER_MODEL_NAME=base
      - WHISPER_DEVICE=cpu
    volumes:
      - ./data:/app/data
      - ./models_saved:/app/models_saved
      - ./visualizations:/app/visualizations
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
